name: Linux Wine diagnostic smoke test

on:
  push:
    branches: [research/3dfx-hang-diagnostics]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        shell: bash
        run: bash -n tools/diagnose-3dfx-hang-linux.sh
      - name: Test process diagnostics with synthetic process (no commercial game)
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 30 &
          target=$!
          trap 'kill "$target" 2>/dev/null || true' EXIT
          bash tools/diagnose-3dfx-hang-linux.sh --pid "$target" --interval 1 --output "$RUNNER_TEMP/scorchedplanet-linux-smoketest"
          test -s "$RUNNER_TEMP/scorchedplanet-linux-smoketest/summary.txt"
          test -s "$RUNNER_TEMP/scorchedplanet-linux-smoketest/snapshot-1-thread-ticks.tsv"
          test -s "$RUNNER_TEMP/scorchedplanet-linux-smoketest/snapshot-2-thread-ticks.tsv"
          test -s "$RUNNER_TEMP/scorchedplanet-linux-smoketest/thread-cpu-delta.tsv"
      - name: Test wait mode and current-directory log
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/scorchedplanet-wait-test"
          mkdir -p "$work"
          cp /bin/sleep "$work/spvoodoo.exe"
          script="$GITHUB_WORKSPACE/tools/diagnose-3dfx-hang-linux.sh"
          ( sleep 2; "$work/spvoodoo.exe" 20 ) &
          launcher=$!
          trap 'kill "$launcher" 2>/dev/null || true; pkill -f "$work/spvoodoo.exe" || true' EXIT
          (
            cd "$work"
            bash "$script" --wait --delay 1 --interval 1
          )
          compgen -G "$work/ScorchedPlanetFix-3dfx-*.log" > /dev/null
          ls -l "$work"/ScorchedPlanetFix-3dfx-*.log
      - name: Test WINEPREFIX matching and reject known mismatches
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/scorchedplanet-prefix-test"
          mkdir -p "$work/prefix-one" "$work/prefix-two"
          WINEPREFIX="$work/prefix-one" sleep 30 &
          target=$!
          trap 'kill "$target" 2>/dev/null || true' EXIT
          WINEPREFIX="$work/prefix-one/" bash tools/diagnose-3dfx-hang-linux.sh --pid "$target" --interval 1 --output "$work/report-ok"
          test -s "$work/report-ok/summary.txt"
          if WINEPREFIX="$work/prefix-two" bash tools/diagnose-3dfx-hang-linux.sh --pid "$target" --interval 1 --output "$work/report-wrong"; then
            echo "Mismatched prefix was unexpectedly accepted"
            exit 1
          fi
      - name: Test explicit sudo GDB control flow using mocked tools
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/scorchedplanet-gdb-mock-test"
          mkdir -p "$work/bin"
          printf '%s\n' '#!/usr/bin/env bash' 'if [[ "$1" == "-v" ]]; then exit 0; fi' 'if [[ "$1" == "-n" ]]; then shift; exec "$@"; fi' 'exit 1' > "$work/bin/sudo"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'while (($#)); do if [[ "$1" == "-p" ]]; then tid="$2"; break; fi; shift; done' \
            'printf "Thread 1 (Thread 0xffff (LWP %s)):\\n" "$tid"' \
            'printf "\\$1 = 0x401000\\n=> 0x401000: jmp 0x401000\\n#0 0x401000 in game_loop()\\n"' \
            > "$work/bin/gdb"
          chmod +x "$work/bin/sudo" "$work/bin/gdb"
          sleep 25 &
          target=$!
          trap 'kill "$target" 2>/dev/null || true' EXIT
          PATH="$work/bin:$PATH" bash tools/diagnose-3dfx-hang-linux.sh --pid "$target" --interval 1 --gdb-sudo --output "$work/report"
          test -s "$work/report/gdb-sample-1.txt"
          test -s "$work/report/gdb-sample-2.txt"
          grep -q 'GDB_SUDO=1' "$work/report/summary.txt"
          grep -q '0x401000' ScorchedPlanetFix-3dfx-*.log
          grep -q 'game_loop()' ScorchedPlanetFix-3dfx-*.log
      - name: Test perf opt-in and report extraction using mocked tools
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/scorchedplanet-perf-mock-test"
          mkdir -p "$work/bin" "$work/game"
          printf '%s\n' '#!/usr/bin/env bash' \
            'if [[ "$1" == "-v" ]]; then exit 0; fi' \
            'if [[ "$1" == "-n" ]]; then shift; exec "$@"; fi' \
            'exit 1' > "$work/bin/sudo"
          cat > "$work/bin/perf" <<'PERF_MOCK'
          #!/usr/bin/env bash
          command="$1"; shift
          case "$command" in
            record)
              output=""
              while (($#)); do
                if [[ "$1" == "-o" ]]; then shift; output="$1"; fi
                shift
              done
              [[ -n "$output" ]] || exit 1
              printf 'dummy profile' > "$output"
              ;;
            report) echo "92.00% SPVOODOO.EXE 0x00401234" ;;
            script)
              printf '%s\n' \
                '0x00401234 [unknown] (SPVOODOO.EXE)' \
                '0x00401234 [unknown] (SPVOODOO.EXE)' \
                '0x00401239 [unknown] (SPVOODOO.EXE)'
              ;;
            *) exit 1 ;;
          esac
          PERF_MOCK
          chmod +x "$work/bin/sudo" "$work/bin/perf"
          sleep 20 &
          target=$!
          trap 'kill "$target" 2>/dev/null || true' EXIT
          (
            cd "$work/game"
            PATH="$work/bin:$PATH" bash "$GITHUB_WORKSPACE/tools/diagnose-3dfx-hang-linux.sh" \
              --pid "$target" --interval 1 --perf-sudo --output "$work/report"
          )
          test -s "$work/report/perf.data"
          test -s "$work/report/perf-report.txt"
          test -s "$work/report/perf-samples.txt"
          grep -q 'PERF_SUDO=1' "$work/report/summary.txt"
          grep -q '0x00401234' "$work"/game/ScorchedPlanetFix-3dfx-*.log
          grep -q '2 0x00401234' "$work"/game/ScorchedPlanetFix-3dfx-*.log
