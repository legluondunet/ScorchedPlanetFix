name: Cleanup Windows CI run history

# Manually triggered only. Deletes *runs* of Windows CI, never releases,
# tags, or the separate publication workflows.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only: do not delete anything (recommended first)'
        required: true
        type: boolean
        default: true
      confirmation:
        description: 'To delete, uncheck dry_run and type DELETE-WINDOWS-CI-RUNS'
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: scorchedplanetfix-manual-windows-ci-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'legluondunet/ScorchedPlanetFix' && github.ref == 'refs/heads/main'
    name: Preview or delete completed Windows CI history
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Cleanup only rust-fadelow-patcher.yml completed runs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != "true" && "$DRY_RUN" != "false" ]]; then
            echo "::error::Unexpected dry_run input"
            exit 1
          fi
          if [[ "$DRY_RUN" == "false" && "$CONFIRMATION" != "DELETE-WINDOWS-CI-RUNS" ]]; then
            echo "::error::Deletion refused: confirmation must be DELETE-WINDOWS-CI-RUNS"
            exit 1
          fi

          # Paginate through *this workflow only*. It does not match any
          # publish-v*.yml workflow or this cleanup workflow itself.
          runs="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/rust-fadelow-patcher.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id')"

          if [[ -z "$runs" ]]; then
            echo "No completed Windows CI runs to clean."
            echo "No completed Windows CI runs found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          planned=0
          deleted=0
          while IFS= read -r run_id; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error::Invalid run ID"; exit 1; }
            planned=$((planned + 1))
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "PREVIEW: would delete Windows CI run $run_id"
            else
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" >/dev/null
              deleted=$((deleted + 1))
              echo "DELETED: Windows CI run $run_id"
              # Avoid a burst of GitHub API write requests.
              sleep 0.5
            fi
          done <<< "$runs"

          {
            echo "## Windows CI run cleanup"
            echo ""
            echo "- Target: \`rust-fadelow-patcher.yml\` only"
            echo "- Completed runs found: $planned"
            echo "- Actually deleted: $deleted"
            echo "- Mode: $([[ "$DRY_RUN" == "true" ]] && echo preview || echo deletion)"
            echo "- Publication workflows and GitHub Releases: untouched"
          } >> "$GITHUB_STEP_SUMMARY"
