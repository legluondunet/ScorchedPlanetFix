name: Windows installer CI

on:
  push:
    branches: [feat/rust-installer]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Test installer logic
        run: cargo test --all-targets
      - name: Build Windows installer
        run: cargo build --release
      - name: Upload EXE (development build)
        uses: actions/upload-artifact@v4
        with:
          name: ScorchedPlanetSetup-Windows-development
          path: target/release/scorched-planet-setup.exe
          if-no-files-found: error
