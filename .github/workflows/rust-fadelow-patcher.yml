name: ScorchedPlanetFix Windows 1.0 CLI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows CLI build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Add Windows x64 target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Test all targets (includes ISO and FadeLow tests)
        run: cargo test --locked --target x86_64-pc-windows-msvc --all-targets
      - name: Compile release console (Windows x64 only)
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin scorched-planet-fix
      - name: Verify Windows x64 console subsystem and executable
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/scorched-planet-fix.exe"
          if (!(Test-Path $exe)) { throw "Missing patcher binary" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x8664) { throw "Expected AMD64 PE (0x8664), received $machine" }
          $optional = $pe + 24
          $magic = [BitConverter]::ToUInt16($bytes, $optional)
          if ($magic -ne 0x20b) { throw "Expected PE32+ optional header (0x20b), received $magic" }
          $subsystem = [BitConverter]::ToUInt16($bytes, $optional + 68)
          if ($subsystem -ne 3) { throw "Expected Windows console subsystem (3), received $subsystem" }
          Write-Host "Windows x64 console verified; size=$($bytes.Length)"
      - name: Package executable, GPL license, README and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/scorched-planet-fix.exe dist/ScorchedPlanetFix.exe
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item README.md dist/README.md
          $digest = (Get-FileHash dist/ScorchedPlanetFix.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  ScorchedPlanetFix.exe" | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Compress-Archive -Path dist/* -DestinationPath ScorchedPlanetFix-v1.0.0-Windows-x64.zip
      - name: Verify packaged ZIP and SHA-256 manifest
        shell: pwsh
        run: |
          $archive = "ScorchedPlanetFix-v1.0.0-Windows-x64.zip"
          $unpacked = "dist-verify"
          Expand-Archive -Path $archive -DestinationPath $unpacked -Force
          $expectedFiles = @("ScorchedPlanetFix.exe", "LICENSE.txt", "README.md", "SHA256SUMS.txt")
          foreach ($name in $expectedFiles) {
            if (!(Test-Path -PathType Leaf (Join-Path $unpacked $name))) {
              throw "Release archive is missing $name"
            }
          }
          $actualFiles = @(Get-ChildItem -Path $unpacked -File)
          if ($actualFiles.Count -ne $expectedFiles.Count) {
            throw "Release archive contains unexpected or duplicate files"
          }
          $manifest = (Get-Content (Join-Path $unpacked "SHA256SUMS.txt") -Raw).Trim()
          if ($manifest -cnotmatch '^[0-9a-f]{64}  ScorchedPlanetFix\.exe$') {
            throw "Invalid SHA256SUMS.txt format"
          }
          $actualHash = (Get-FileHash (Join-Path $unpacked "ScorchedPlanetFix.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.Substring(0,64) -cne $actualHash) {
            throw "SHA-256 of packaged executable does not match SHA256SUMS.txt"
          }
          Write-Host "Release ZIP verified: four expected files, executable SHA-256 matches manifest"
      - name: Upload verified Windows CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: ScorchedPlanetFix-v1.0.0-Windows-x64
          path: ScorchedPlanetFix-v1.0.0-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
