name: ScorchedPlanetFix Windows CLI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows CLI build and tests
    runs-on: windows-latest
    steps:
      - name: Check out ScorchedPlanetFix
        uses: actions/checkout@v5

      - name: Check out pinned Apache-2.0 GameFrame source
        uses: actions/checkout@v5
        with:
          repository: tanepiper/game-frame
          ref: f195a074a63cc150673c38becdec696163b0b3d1
          path: third_party/game-frame
          persist-credentials: false

      - name: Rust toolchain with Windows x86 and x64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc, x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Apply pinned Scorched-specific native window and 60 FPS fixes
        shell: pwsh
        run: |
          python tools/gameframe/patch_scorched.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned GameFrame compatibility patch failed' }
          Write-Host 'Desktop mode preserved, native Scorched Planet HWND adopted, cap=60 FPS'
      - name: Build GameFrame x86 Glide wrapper (Scorched-only patch; no Cyber fixes)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = (Resolve-Path 'third_party/game-frame/wrappers/Cargo.toml').Path
          $upstreamDef = (Resolve-Path 'third_party/game-frame/wrappers/glide/glide2x.def').Path
          # The original .def maps decorated public stdcall exports to GNU COFF
          # internals. For MSVC x86, the internal alias needs its leading '_'.
          $patched = Join-Path $env:RUNNER_TEMP 'scorched-gameframe-x86.def'
          $original = Get-Content -Raw $upstreamDef
          $converted = [regex]::Replace($original, '(?m)^(_[A-Za-z0-9_]+@\d+)=(\w+@\d+)\r?$', '$1=_$2')
          $count = ([regex]::Matches($converted, '(?m)^_[A-Za-z0-9_]+@\d+=_[A-Za-z0-9_]+@\d+\r?$')).Count
          if ($count -ne 156) { throw "Expected exactly 156 adapted Glide exports, got $count" }
          Set-Content -Path $patched -Value $converted -Encoding ascii
          $env:RUSTFLAGS = "-C link-arg=/DEF:$patched"
          cargo build -p glide --release --target i686-pc-windows-msvc --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { throw 'GameFrame x86 MSVC build failed' }

      - name: Test patched GameFrame x86 menu-recognition and glyph helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = (Resolve-Path 'third_party/game-frame/wrappers/Cargo.toml').Path
          cargo test -p glide --lib --target i686-pc-windows-msvc --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { throw 'Patched GameFrame menu recognition or unit tests failed' }

      - name: Audit 156 exact decorated exports and Windows x86 PE
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pefile
          if ($LASTEXITCODE -ne 0) { throw 'pefile dependency failed' }
          $dll = 'third_party/game-frame/wrappers/target/i686-pc-windows-msvc/release/glide2x.dll'
          python tools/gameframe/audit_exports.py $dll 'third_party/game-frame/wrappers/glide/glide2x.def'
          if ($LASTEXITCODE -ne 0) { throw 'GameFrame Glide ABI audit failed' }

      - name: Build and test Windows x64 launcher with embedded GameFrame
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'third_party/game-frame/wrappers/target/i686-pc-windows-msvc/release/glide2x.dll'
          $env:SCORCHED_GAMEFRAME_DLL_PATH = (Resolve-Path $dll).Path
          $env:SCORCHED_GAMEFRAME_SHA256 = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          cargo test --locked --target x86_64-pc-windows-msvc --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'GameFrame-embedded CLI tests failed' }
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin scorched-planet-fix
          if ($LASTEXITCODE -ne 0) { throw 'GameFrame-embedded CLI build failed' }
          $exe = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/scorched-planet-fix.exe').Path
          $version = (& $exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^ScorchedPlanetFix 2\.0\.1-[0-9a-f]{8}$') {
            throw "Unexpected version: $version"
          }
          Write-Host "Embedded GameFrame SHA256=$env:SCORCHED_GAMEFRAME_SHA256"
          Write-Host "GameFrame-only v2 stable launcher: $version"
          $help = (& $exe --help | Out-String)
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'GameFrame' -or $help -match 'ScorchedPlanetFix.exe --3dfx-logo') {
            throw 'Stable help missing GameFrame or advertising removed nGlide option'
          }
          $obsolete = (& $exe --3dfx-logo 2>&1 | Out-String)
          if ($LASTEXITCODE -eq 0 -or $obsolete -notmatch 'Unknown or incompatible option') {
            throw "Obsolete --3dfx-logo should be refused: $obsolete"
          }
          $global:LASTEXITCODE = 0
          Write-Host 'Stable help/version and removed --3dfx-logo: PASS'

      - name: Verify Windows x64 console subsystem and executable
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/scorched-planet-fix.exe"
          if (!(Test-Path $exe)) { throw "Missing patcher binary" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x8664) { throw "Expected AMD64 PE (0x8664), received $machine" }
          $optional = $pe + 24
          $magic = [BitConverter]::ToUInt16($bytes, $optional)
          if ($magic -ne 0x20b) { throw "Expected PE32+ optional header (0x20b), received $magic" }
          $subsystem = [BitConverter]::ToUInt16($bytes, $optional + 68)
          if ($subsystem -ne 3) { throw "Expected Windows console subsystem (3), received $subsystem" }
          Write-Host "Windows x64 console verified; size=$($bytes.Length)"
      - name: Native Windows x86 LoadLibrary smoke (without changing display mode)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testFolder = Join-Path $env:RUNNER_TEMP 'scorched-glide-load'
          New-Item -ItemType Directory -Path $testFolder -Force | Out-Null
          Copy-Item 'third_party/game-frame/wrappers/target/i686-pc-windows-msvc/release/glide2x.dll' (Join-Path $testFolder 'glide.dll')
          $probe = Join-Path $testFolder 'GameFrameGlideSmoke.exe'
          rustc --edition=2021 --target i686-pc-windows-msvc tools/gameframe/smoke_load.rs -o $probe
          if ($LASTEXITCODE -ne 0) { throw 'Cannot build 32-bit GameFrame smoke' }
          # Exercise the *DLL's* log path and session correlation, not just loading.
          $dllLog = Join-Path $testFolder 'ScorchedPlanetFix.log'
          $env:GLIDE_LOG = $dllLog
          $env:SCORCHED_FIX_SESSION_ID = 'ci-gameframe-smoke-1'
          $env:SCORCHED_FIX_SIGNATURE = 'ScorchedPlanetFix 2.0.1-ci'
          Push-Location $testFolder
          try {
            & '.\GameFrameGlideSmoke.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Glide LoadLibrary smoke failed' }
            if (!(Test-Path $dllLog)) { throw 'GameFrame DLL log was not created' }
            $dllText = Get-Content $dllLog -Raw
            if (!$dllText.Contains('SCORCHED_SESSION: session_id=ci-gameframe-smoke-1')) {
              throw "GameFrame did not log the shared session ID: $dllText"
            }
            if (Test-Path (Join-Path $testFolder 'ScorchedPlanetFix_installer.log')) {
              throw 'DLL LoadLibrary unexpectedly created the installer log'
            }
          } finally {
            Pop-Location
            Remove-Item Env:GLIDE_LOG -ErrorAction SilentlyContinue
            Remove-Item Env:SCORCHED_FIX_SESSION_ID -ErrorAction SilentlyContinue
            Remove-Item Env:SCORCHED_FIX_SIGNATURE -ErrorAction SilentlyContinue
          }

      - name: Smoke CLI automatic launch refusal without game media
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/scorched-planet-fix.exe').Path
          $root = Split-Path -Parent $exe
          $logFile = Join-Path $root 'ScorchedPlanetFix_installer.log'
          $dllLog = Join-Path $root 'ScorchedPlanetFix.log'
          $beforeErrors = if (Test-Path $logFile) { @(Get-Content $logFile | Where-Object { $_ -match '^ERROR:' }).Count } else { 0 }
          if (Test-Path (Join-Path $root 'splanet')) { throw 'Unexpected game directory before smoke' }
          $out = (& $exe 2>&1 | Out-String)
          if ($LASTEXITCODE -eq 0 -or $out -notmatch 'No ISO/CUE disc image') {
            throw "No-CD safe refusal failed: $out"
          }
          if (Test-Path (Join-Path $root 'splanet')) { throw 'An invalid game directory was created' }
          if (!(Test-Path $logFile)) { throw 'Installer log was not created' }
          if (Test-Path $dllLog) { throw 'GameFrame DLL log must not be created without launching game' }
          $afterErrors = @(Get-Content $logFile | Where-Object { $_ -match '^ERROR:' }).Count
          if ($afterErrors -ne ($beforeErrors + 1)) {
            throw "Expected exactly one error line for one failed launch; before=$beforeErrors after=$afterErrors"
          }
          $global:LASTEXITCODE = 0
          Write-Host 'No-media refusal and exactly one installer log error; no DLL log: PASS'

      - name: Package GameFrame launcher, source licenses, and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/scorched-planet-fix.exe' dist/ScorchedPlanetFix.exe
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item 'third_party/game-frame/LICENSE-APACHE' dist/LICENSE-APACHE.txt
          Copy-Item README.md dist/README.md
          Copy-Item docs/release-notes-v2.0.1.md dist/RELEASE-NOTES.txt
          Copy-Item docs/gameframe-experiment.md dist/GAMEFRAME-INFO.txt
          $hash = (Get-FileHash dist/ScorchedPlanetFix.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ScorchedPlanetFix.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          $files = @(Get-ChildItem dist -File)
          if ($files.Count -ne 7) { throw "Expected 7 files in v2 artifact, got $($files.Count)" }
          if (@(Get-ChildItem dist -File | Where-Object { $_.Extension -in @('.dll','.zip') }).Count -gt 0) {
            throw 'The distributable must have no standalone DLL and no nested ZIP'
          }
          $line = (Get-Content dist/SHA256SUMS.txt -Raw).Trim()
          if ($line -cne "$hash  ScorchedPlanetFix.exe") { throw 'SHA256 manifest mismatch' }
          Write-Host "One-file launcher + Apache license, sha256=$hash"

      - name: Verify release-ready GameFrame ZIP and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'ScorchedPlanetFix-v2.0.1-Windows-x64.zip'
          Compress-Archive -Path dist/* -DestinationPath $archive
          Expand-Archive -Path $archive -DestinationPath dist-verify -Force
          $expected = @('ScorchedPlanetFix.exe','LICENSE.txt','LICENSE-APACHE.txt','README.md','RELEASE-NOTES.txt','GAMEFRAME-INFO.txt','SHA256SUMS.txt')
          $actual = @(Get-ChildItem dist-verify -File)
          if ($actual.Count -ne $expected.Count) { throw "Wrong file count in GameFrame ZIP: $($actual.Count)" }
          foreach ($name in $expected) {
            if (!(Test-Path -PathType Leaf (Join-Path dist-verify $name))) { throw "Missing $name in GameFrame ZIP" }
          }
          $manifest = (Get-Content dist-verify/SHA256SUMS.txt -Raw).Trim()
          if ($manifest -cnotmatch '^[0-9a-f]{64}  ScorchedPlanetFix\.exe$') { throw 'Bad SHA256SUMS format' }
          $hash=(Get-FileHash dist-verify/ScorchedPlanetFix.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.Substring(0,64) -cne $hash) { throw 'GameFrame ZIP checksum mismatch' }
          Write-Host "Verified GameFrame stable ZIP: 7 files and SHA256=$hash"

      # Artifacts already use ZIP internally. Upload 7 flat files, not ZIP-in-ZIP.
      - name: Upload verified Windows GameFrame files
        uses: actions/upload-artifact@v6
        with:
          name: ScorchedPlanetFix-v2.0.1-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
