name: ScorchedPlanetFix Windows CLI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main, diagnostics/matrox-f12-lighting-input-20261124]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows CLI build and tests
    runs-on: windows-latest
    steps:
      - name: Check out ScorchedPlanetFix
        uses: actions/checkout@v5

      - name: Check out pinned Apache-2.0 GameFrame source
        uses: actions/checkout@v5
        with:
          repository: tanepiper/game-frame
          ref: f195a074a63cc150673c38becdec696163b0b3d1
          path: third_party/game-frame
          persist-credentials: false

      - name: Check out pinned Khronos Vulkan headers
        uses: actions/checkout@v5
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: b379292b2ab6df5771ba9870d53cf8b2c9295daf
          path: third_party/vulkan-headers
          persist-credentials: false

      - name: Test offline MSI95 log triage (synthetic fixtures, no game data)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/matrox/test_analyze_runtime_log.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox runtime log triage tests failed' }
          python -m py_compile tools/matrox/analyze_runtime_log.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox runtime log triage syntax check failed' }

      - name: Test F12 BMP spatial triage (synthetic RGB565 fixtures only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/matrox/test_analyze_f12_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox F12 cross-layer triage tests failed' }
          python -m py_compile tools/matrox/analyze_f12_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox F12 cross-layer triage syntax check failed' }

      - name: Test F12 last-write shadow provenance (synthetic RGB565 fixtures)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/matrox/test_analyze_shadow_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox F12 shadow capture tests failed' }
          python -m py_compile tools/matrox/analyze_shadow_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox shadow analysis syntax failed' }

      - name: Test F12 multi-scene cockpit HUD ownership (synthetic RGB565 fixtures)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/matrox/test_compare_hud_captures.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox HUD coverage comparisons failed' }
          python -m py_compile tools/matrox/compare_hud_captures.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox HUD analysis syntax failed' }

      - name: Test optional Matrox screenshot geometry alignment (synthetic images only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --quiet "opencv-python-headless>=4.8,<5" "numpy>=1.24,<3"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install optional image registration test requirements' }
          python tools/matrox/test_align_reference_captures.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox screenshot alignment tests failed' }
          python -m py_compile tools/matrox/align_reference_captures.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox screenshot alignment syntax check failed' }

      - name: Test original-format Matrox TITLEM atlas inspector (synthetic fixtures)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/matrox/test_inspect_titlem_atlases.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox TITLEM synthetic atlas tests failed' }
          python -m py_compile tools/matrox/inspect_titlem_atlases.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox TITLEM atlas script syntax failed' }

      - name: Test F12 last successful texel origin (synthetic RGB565 fixtures)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/matrox/test_analyze_final_texel_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'F12 final texel provenance tests failed' }
          python -m py_compile tools/matrox/analyze_final_texel_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'F12 final texel analyzer syntax failed' }

      - name: Test Matrox seventh F12 pre-light and exact palette index audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/matrox/test_analyze_source_audit_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox F12 pre-light source audit tests failed' }
          python -m py_compile tools/matrox/analyze_source_audit_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox F12 pre-light source audit syntax failed' }

      - name: Test F12 no-dither last-write reference (synthetic RGB565 fixtures)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/matrox/test_analyze_undithered_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'F12 no-dither last-write source audit tests failed' }
          python -m py_compile tools/matrox/analyze_undithered_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'F12 no-dither analyzer syntax failed' }

      - name: Test exact Matrox F12 lighting inputs (synthetic native RGB565 fixtures)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/matrox/test_analyze_lighting_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox ninth F12 lighting audit tests failed' }
          python -m py_compile tools/matrox/analyze_lighting_capture.py
          if ($LASTEXITCODE -ne 0) { throw 'Matrox ninth F12 lighting analyzer syntax failed' }

      - name: Rust toolchain with Windows x86 and x64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc, x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Apply pinned Scorched-specific native window and 60 FPS fixes
        shell: pwsh
        run: |
          python tools/gameframe/patch_scorched.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned GameFrame compatibility patch failed' }
          Write-Host 'Desktop mode preserved, native Scorched Planet HWND adopted, cap=60 FPS'
      - name: Build GameFrame x86 Glide wrapper (Scorched-only patch; no Cyber fixes)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = (Resolve-Path 'third_party/game-frame/wrappers/Cargo.toml').Path
          $upstreamDef = (Resolve-Path 'third_party/game-frame/wrappers/glide/glide2x.def').Path
          # The original .def maps decorated public stdcall exports to GNU COFF
          # internals. For MSVC x86, the internal alias needs its leading '_'.
          $patched = Join-Path $env:RUNNER_TEMP 'scorched-gameframe-x86.def'
          $original = Get-Content -Raw $upstreamDef
          $converted = [regex]::Replace($original, '(?m)^(_[A-Za-z0-9_]+@\d+)=(\w+@\d+)\r?$', '$1=_$2')
          $count = ([regex]::Matches($converted, '(?m)^_[A-Za-z0-9_]+@\d+=_[A-Za-z0-9_]+@\d+\r?$')).Count
          if ($count -ne 156) { throw "Expected exactly 156 adapted Glide exports, got $count" }
          Set-Content -Path $patched -Value $converted -Encoding ascii
          $env:RUSTFLAGS = "-C link-arg=/DEF:$patched"
          cargo build -p glide --release --target i686-pc-windows-msvc --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { throw 'GameFrame x86 MSVC build failed' }

      - name: Test patched GameFrame x86 menu-recognition and glyph helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = (Resolve-Path 'third_party/game-frame/wrappers/Cargo.toml').Path
          cargo test -p glide --lib --target i686-pc-windows-msvc --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { throw 'Patched GameFrame menu recognition or unit tests failed' }

      - name: Audit 156 exact decorated exports and Windows x86 PE
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pefile
          if ($LASTEXITCODE -ne 0) { throw 'pefile dependency failed' }
          $dll = 'third_party/game-frame/wrappers/target/i686-pc-windows-msvc/release/glide2x.dll'
          python tools/gameframe/audit_exports.py $dll 'third_party/game-frame/wrappers/glide/glide2x.def'
          if ($LASTEXITCODE -ne 0) { throw 'GameFrame Glide ABI audit failed' }

      - name: Compile clean-room MSI95 x86 from pinned source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/matrox/build-msi95.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Clean-room MSI95 build failed' }
          $msi = 'target/matrox-msi95-x86/msi95.dll'
          python tools/matrox/audit_exports.py $msi
          if ($LASTEXITCODE -ne 0) { throw 'Matrox MSI95 x86 nine-export ABI audit failed' }
          Write-Host "Built Matrox MSI95 SHA256=$((Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant())"

      - name: Build and validate standalone MSI95 synthetic lighting probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/matrox/build-lighting-probe.ps1
          $folder = Join-Path $env:RUNNER_TEMP 'scorched-msi95-lighting-probe'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item 'target/matrox-lighting-probe/MatroxLightingProbe.exe' $folder
          Copy-Item 'target/matrox-msi95-x86/msi95.dll' $folder
          $env:MATROX_MSI_MODULATE = '1'
          $env:MATROX_MSI_DITHER = '1'
          $env:MATROX_MSI_FPS_LIMIT = '0'
          $env:MATROX_MSI_BORDERLESS = '0'
          $env:MATROX_MSI_WORLD_BILINEAR = '0'
          $env:MATROX_MSI_RGB888_LIGHTING = '0'
          $env:MATROX_MSI_PRESENTATION_SMOOTH = '0'
          $env:MATROX_MSI_RENDERER = 'software'
          Push-Location $folder
          try {
            & '.\MatroxLightingProbe.exe'
            if ($LASTEXITCODE -ne 0) { throw "Synthetic lighting probe failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
            foreach ($key in @('MODULATE','DITHER','FPS_LIMIT','BORDERLESS','WORLD_BILINEAR','RGB888_LIGHTING','PRESENTATION_SMOOTH','RENDERER')) {
              Remove-Item "Env:MATROX_MSI_$key" -ErrorAction SilentlyContinue
            }
          }
          $trace = Get-Content (Join-Path $folder 'PROBE.LOG') -Raw
          if (!$trace.Contains('OK BMP saved') -or !$trace.Contains('Exit code=0')) { throw 'Missing successful lighting probe checkpoints' }
          $missing = Join-Path $env:RUNNER_TEMP 'scorched-msi95-lighting-missing-dll'
          New-Item -ItemType Directory -Force -Path $missing | Out-Null
          Copy-Item 'target/matrox-lighting-probe/MatroxLightingProbe.exe' $missing
          Push-Location $missing
          try {
            & '.\MatroxLightingProbe.exe'
            if ($LASTEXITCODE -ne 1) { throw "Missing DLL probe returned unexpected code: $LASTEXITCODE" }
            $trace = Get-Content 'PROBE.LOG' -Raw
            if (!$trace.Contains('LoadLibraryA error=') -or !$trace.Contains('Exit code=1')) { throw 'Missing DLL diagnostic incomplete' }
          } finally { Pop-Location }
          python tools/matrox/check_lighting_probe.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Lighting comparison model self-test failed' }
          python tools/matrox/check_lighting_probe.py (Join-Path $folder 'msi95_lighting_flag.bmp')
          if ($LASTEXITCODE -ne 0) { throw 'Lighting probe pixel validation failed' }
          python tools/matrox/check_dither_matrix.py (Join-Path $folder 'DITHER.BIN') --software
          if ($LASTEXITCODE -ne 0) { throw 'Independent dither matrix pixel validation failed' }
          Copy-Item (Join-Path $folder 'msi95_lighting_flag.bmp') 'target/matrox-lighting-probe/reference-software.bmp'
          $report = Get-Content (Join-Path $folder 'msi95_lighting_probe.txt') -Raw
          if (!$report.Contains('msiSetTextureBlend=absent')) { throw 'Unexpected standalone software DLL export state' }

      - name: Verify experimental RGB888 lighting in actual MSI95 DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'scorched-msi95-rgb888-lighting'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item 'target/matrox-lighting-probe/MatroxLightingProbe.exe' $folder
          Copy-Item 'target/matrox-msi95-x86/msi95.dll' $folder
          $env:MATROX_MSI_MODULATE = '1'
          $env:MATROX_MSI_DITHER = '1'
          $env:MATROX_MSI_RGB888_LIGHTING = '1'
          $env:MATROX_MSI_PRESENTATION_SMOOTH = '1'
          $env:MATROX_MSI_RENDERER = 'auto'
          $env:MATROX_MSI_LOG = '1'
          $env:MATROX_MSI_FPS_LIMIT = '0'
          $env:MATROX_MSI_BORDERLESS = '0'
          $env:MATROX_MSI_WORLD_BILINEAR = '0'
          Push-Location $folder
          try {
            & '.\MatroxLightingProbe.exe'
            if ($LASTEXITCODE -ne 0) { throw "RGB888 lighting probe failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
            foreach ($key in @('MODULATE','DITHER','RGB888_LIGHTING','FPS_LIMIT','BORDERLESS','WORLD_BILINEAR','PRESENTATION_SMOOTH','LOG','RENDERER')) {
              Remove-Item "Env:MATROX_MSI_$key" -ErrorAction SilentlyContinue
            }
          }
          $runtime = Get-Content (Join-Path (Split-Path $folder -Parent) 'ScorchedPlanetFix.log') -Raw
          if (!$runtime.Contains('PREVIEW_RENDERER requested=vulkan')) { throw 'Vulkan request not passed' }
          if ($runtime.Contains('PREVIEW_RENDERER active=vulkan')) {
            if ($runtime -notmatch 'SESSION_VULKAN frames=\s*[1-9][0-9]*') { throw 'Vulkan selected but no presented frames' }
          } elseif (!$runtime.Contains('active=software') -or !$runtime.Contains('PREVIEW_SCALER HALFTONE blit succeeded')) {
            throw 'Automatic Vulkan fallback did not preserve GDI presentation'
          }
          python tools/matrox/check_dither_matrix.py (Join-Path $folder 'DITHER.BIN') --software --rgb888
          if ($LASTEXITCODE -ne 0) { throw 'RGB888 matrix pixel validation failed' }

      - name: Upload standalone Matrox lighting comparison probe
        if: github.base_ref != 'diagnostics/matrox-f12-lighting-input-20261124'
        uses: actions/upload-artifact@v6
        with:
          name: MatroxLightingProbe-x86
          path: |
            target/matrox-lighting-probe/MatroxLightingProbe.exe
            target/matrox-lighting-probe/reference-software.bmp
          if-no-files-found: error

      - name: Smoke test real x86 Matrox palette-index keying
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'scorched-msi95-palette-smoke'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item 'target/matrox-msi95-x86/msi95.dll' (Join-Path $folder 'msi95.dll')
          $exe = Join-Path $folder 'MatroxPaletteSmoke.exe'
          rustc --edition=2021 --target i686-pc-windows-msvc tools/matrox/smoke_palette.rs -o $exe
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile real MSI95 palette-keying smoke test' }
          Push-Location $folder
          try {
            & $exe
            if ($LASTEXITCODE -ne 0) { throw 'MSI95 palette-index keying regression smoke failed' }
          } finally {
            Pop-Location
          }

      - name: Smoke test MSI95 x86 dynamic texture-heap growth past 256 live allocations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'scorched-msi95-heap-smoke'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item 'target/matrox-msi95-x86/msi95.dll' (Join-Path $folder 'msi95.dll')
          $exe = Join-Path $folder 'MatroxHeapSmoke.exe'
          rustc --edition=2021 --target i686-pc-windows-msvc tools/matrox/smoke_heap.rs -o $exe
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile x86 MSI95 heap smoke test' }
          Push-Location $folder
          try {
            $env:MATROX_MSI_LOG = '0'
            & $exe
            if ($LASTEXITCODE -ne 0) { throw 'MSI95 heap dynamic growth smoke test failed' }
          } finally {
            Pop-Location
            Remove-Item Env:MATROX_MSI_LOG -ErrorAction SilentlyContinue
          }

      - name: Smoke MSI95 x86 nested callback input ordering
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'scorched-msi95-input-smoke'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item 'target/matrox-msi95-x86/msi95.dll' (Join-Path $folder 'msi95.dll')
          $exe = Join-Path $folder 'MatroxInputPumpSmoke.exe'
          rustc --edition=2021 --target i686-pc-windows-msvc tools/matrox/smoke_input_pump.rs -o $exe
          if ($LASTEXITCODE -ne 0) { throw 'Cannot compile MSI95 x86 input reentrancy test' }
          Push-Location $folder
          try {
            $env:MATROX_MSI_LOG = '1'
            $env:MATROX_MSI_FPS_LIMIT = '0'
            $env:MATROX_MSI_BORDERLESS = '0'
            # Hosted Windows CI cannot provide a desktop HWND. Runtime GUI
            # assertions remain strict when the smoke is run locally.
            $env:SCORCHED_ALLOW_HEADLESS_INPUT_SMOKE = '1'
            & $exe
            if ($LASTEXITCODE -ne 0) { throw 'MSI95 x86 recursive callback regression failed' }
            # The runtime log must identify Windows/Wine without a matching launcher log.
            $runtimeLog = Join-Path $env:RUNNER_TEMP 'ScorchedPlanetFix.log'
            if (-not (Test-Path -LiteralPath $runtimeLog)) { throw 'MSI95 host log was not generated' }
            $diagnostics = Get-Content -LiteralPath $runtimeLog -Raw
            if (-not $diagnostics.Contains('SYS-OS: runtime=Windows native')) {
              throw 'MSI95 runtime host detection did not identify native Windows'
            }
            if (-not $diagnostics.Contains('SYS-WINE: not detected')) {
              throw 'MSI95 runtime Wine marker missing on native Windows'
            }
            if (-not $diagnostics.Contains('SYS-PROTON: not detected (native Windows)')) {
              throw 'MSI95 runtime Proton marker missing on native Windows'
            }
            Write-Host 'MSI95_HOST_LOG_SMOKE_PASS native Windows labels in standalone ScorchedPlanetFix.log'
            Remove-Item -LiteralPath $runtimeLog -Force
          } finally {
            Pop-Location
            Remove-Item Env:MATROX_MSI_LOG -ErrorAction SilentlyContinue
            Remove-Item Env:MATROX_MSI_FPS_LIMIT -ErrorAction SilentlyContinue
            Remove-Item Env:MATROX_MSI_BORDERLESS -ErrorAction SilentlyContinue
            Remove-Item Env:SCORCHED_ALLOW_HEADLESS_INPUT_SMOKE -ErrorAction SilentlyContinue
          }

      - name: Build and test Windows x64 launcher with embedded GameFrame
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'third_party/game-frame/wrappers/target/i686-pc-windows-msvc/release/glide2x.dll'
          $env:SCORCHED_GAMEFRAME_DLL_PATH = (Resolve-Path $dll).Path
          $env:SCORCHED_GAMEFRAME_SHA256 = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $msi = 'target/matrox-msi95-x86/msi95.dll'
          $env:SCORCHED_MSI95_DLL_PATH = (Resolve-Path $msi).Path
          $env:SCORCHED_MSI95_SHA256 = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          cargo test --locked --target x86_64-pc-windows-msvc --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'GameFrame-embedded CLI tests failed' }
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin scorched-planet-fix
          if ($LASTEXITCODE -ne 0) { throw 'GameFrame-embedded CLI build failed' }
          $exe = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/scorched-planet-fix.exe').Path
          $version = (& $exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^ScorchedPlanetFix 2\.0\.2-[0-9a-f]{8}$') {
            throw "Unexpected version: $version"
          }
          Write-Host "Embedded GameFrame SHA256=$env:SCORCHED_GAMEFRAME_SHA256"
          Write-Host "Dual-backend GameFrame + Matrox experimental launcher: $version"
          $help = (& $exe --help | Out-String)
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'GameFrame' -or $help -match 'ScorchedPlanetFix.exe --3dfx-logo') {
            throw 'Stable help missing GameFrame or advertising removed nGlide option'
          }
          $obsolete = (& $exe --3dfx-logo 2>&1 | Out-String)
          if ($LASTEXITCODE -eq 0 -or $obsolete -notmatch 'Unknown or incompatible option') {
            throw "Obsolete --3dfx-logo should be refused: $obsolete"
          }
          $global:LASTEXITCODE = 0
          Write-Host 'Stable help/version and removed --3dfx-logo: PASS'

      - name: Verify Windows x64 console subsystem and executable
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/scorched-planet-fix.exe"
          if (!(Test-Path $exe)) { throw "Missing patcher binary" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x8664) { throw "Expected AMD64 PE (0x8664), received $machine" }
          $optional = $pe + 24
          $magic = [BitConverter]::ToUInt16($bytes, $optional)
          if ($magic -ne 0x20b) { throw "Expected PE32+ optional header (0x20b), received $magic" }
          $subsystem = [BitConverter]::ToUInt16($bytes, $optional + 68)
          if ($subsystem -ne 3) { throw "Expected Windows console subsystem (3), received $subsystem" }
          Write-Host "Windows x64 console verified; size=$($bytes.Length)"
      - name: Native Windows x86 LoadLibrary smoke (without changing display mode)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testFolder = Join-Path $env:RUNNER_TEMP 'scorched-glide-load'
          New-Item -ItemType Directory -Path $testFolder -Force | Out-Null
          Copy-Item 'third_party/game-frame/wrappers/target/i686-pc-windows-msvc/release/glide2x.dll' (Join-Path $testFolder 'glide.dll')
          $probe = Join-Path $testFolder 'GameFrameGlideSmoke.exe'
          rustc --edition=2021 --target i686-pc-windows-msvc tools/gameframe/smoke_load.rs -o $probe
          if ($LASTEXITCODE -ne 0) { throw 'Cannot build 32-bit GameFrame smoke' }
          # Exercise the *DLL's* log path and session correlation, not just loading.
          $dllLog = Join-Path $testFolder 'ScorchedPlanetFix.log'
          $env:GLIDE_LOG = $dllLog
          $env:SCORCHED_FIX_LOG = '1'
          $env:SCORCHED_FIX_SESSION_ID = 'ci-gameframe-smoke-1'
          $env:SCORCHED_FIX_SIGNATURE = 'ScorchedPlanetFix 2.0.2-ci'
          Push-Location $testFolder
          try {
            & '.\GameFrameGlideSmoke.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Glide LoadLibrary smoke failed' }
            if (!(Test-Path $dllLog)) { throw 'GameFrame DLL log was not created' }
            $dllText = Get-Content $dllLog -Raw
            if (!$dllText.Contains('SCORCHED_SESSION: session_id=ci-gameframe-smoke-1')) {
              throw "GameFrame did not log the shared session ID: $dllText"
            }
            if (Test-Path (Join-Path $testFolder 'ScorchedPlanetFix_installer.log')) {
              throw 'DLL LoadLibrary unexpectedly created the installer log'
            }
            # Default Log=0 must not create a file even when GLIDE_LOG
            # is inherited. Also prevent diagnostic fallback to stderr.
            Remove-Item $dllLog
            $env:SCORCHED_FIX_LOG = '0'
            $silentOutput = (& '.\GameFrameGlideSmoke.exe' 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw 'Silent Glide LoadLibrary smoke failed' }
            if (Test-Path $dllLog) { throw 'Log=0 unexpectedly created GameFrame runtime log' }
            if ($silentOutput -match 'glide:|SCORCHED_SESSION') {
              throw "Log=0 unexpectedly wrote GameFrame diagnostics: $silentOutput"
            }
          } finally {
            Pop-Location
            Remove-Item Env:GLIDE_LOG -ErrorAction SilentlyContinue
            Remove-Item Env:SCORCHED_FIX_LOG -ErrorAction SilentlyContinue
            Remove-Item Env:SCORCHED_FIX_SESSION_ID -ErrorAction SilentlyContinue
            Remove-Item Env:SCORCHED_FIX_SIGNATURE -ErrorAction SilentlyContinue
          }

      - name: Smoke CLI automatic launch refusal without game media
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/scorched-planet-fix.exe').Path
          $root = Split-Path -Parent $exe
          $logFile = Join-Path $root 'ScorchedPlanetFix_installer.log'
          $dllLog = Join-Path $root 'ScorchedPlanetFix.log'
          # Preload a stale log to prove the next launch starts a NEW session.
          Set-Content -Path $logFile -Value 'STALE_INSTALLER_LOG_SHOULD_BE_TRUNCATED'
          if (Test-Path (Join-Path $root 'game')) { throw 'Unexpected game directory before smoke' }
          $out = (& $exe 2>&1 | Out-String)
          if ($LASTEXITCODE -eq 0 -or $out -notmatch 'No ISO/CUE disc image') {
            throw "No-CD safe refusal failed: $out"
          }
          if (Test-Path (Join-Path $root 'game')) { throw 'An invalid game directory was created' }
          if (!(Test-Path $logFile)) { throw 'Installer log was not created' }
          if (Test-Path $dllLog) { throw 'GameFrame DLL log must not be created without launching game' }
          $contents = Get-Content $logFile -Raw
          $afterErrors = @($contents -split "\r?\n" | Where-Object { $_ -match '^ERROR:' }).Count
          if ($afterErrors -ne 1) {
            throw "Expected exactly one error in the new installer session; got=$afterErrors"
          }
          if ($contents -match 'STALE_INSTALLER_LOG_SHOULD_BE_TRUNCATED') {
            throw 'Installer log still contains lines from the previous session'
          }
          if (@($contents -split "\r?\n" | Where-Object { $_ -match 'session start UTC' }).Count -ne 1) {
            throw 'Installer log must contain exactly one startup session header'
          }
          $global:LASTEXITCODE = 0
          Write-Host 'No-media refusal and exactly one installer log error; no DLL log: PASS'

      - name: Smoke unchecked launch without game files or media access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/scorched-planet-fix.exe').Path
          $root = Split-Path -Parent $exe
          if (Test-Path (Join-Path $root 'game')) { throw 'Game directory must be absent before unchecked smoke' }
          $output = (& $exe --launch-no-verify 2>&1 | Out-String)
          if ($LASTEXITCODE -eq 0 -or $output -notmatch 'Unable to launch unchecked game') {
            throw "Unchecked direct launch did not report the expected OS spawn error: $output"
          }
          if ($output -match 'No ISO/CUE disc image|Verifying all immutable game files') {
            throw "Unchecked launch unexpectedly accessed installer or verification path: $output"
          }
          if (Test-Path (Join-Path $root 'game')) { throw 'Unchecked launch created or modified game directory' }
          $global:LASTEXITCODE = 0
          Write-Host 'Direct unchecked launch bypassed media discovery and file verification: PASS'

      - name: Package GameFrame launcher, source licenses, and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/scorched-planet-fix.exe' dist/ScorchedPlanetFix.exe
          Copy-Item LICENSE dist/LICENSE.txt
          Copy-Item 'third_party/game-frame/LICENSE-APACHE' dist/LICENSE-APACHE.txt
          Copy-Item README.md dist/README.md
          Copy-Item docs/release-notes-v2.0.2.md dist/RELEASE-NOTES.txt
          Copy-Item docs/gameframe-experiment.md dist/GAMEFRAME-INFO.txt
          Add-Content dist/GAMEFRAME-INFO.txt '\nMatrox Vulkan presentation: built with Vulkan-Headers, Copyright 2015-2024 The Khronos Group Inc., Apache-2.0 (see LICENSE-APACHE.txt), pinned b379292b2ab6df5771ba9870d53cf8b2c9295daf. Runtime loader provided by system.'
          $hash = (Get-FileHash dist/ScorchedPlanetFix.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ScorchedPlanetFix.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          $files = @(Get-ChildItem dist -File)
          if ($files.Count -ne 7) { throw "Expected 7 files in v2 artifact, got $($files.Count)" }
          if (@(Get-ChildItem dist -File | Where-Object { $_.Extension -in @('.dll','.zip') }).Count -gt 0) {
            throw 'The distributable must have no standalone DLL and no nested ZIP'
          }
          $line = (Get-Content dist/SHA256SUMS.txt -Raw).Trim()
          if ($line -cne "$hash  ScorchedPlanetFix.exe") { throw 'SHA256 manifest mismatch' }
          Write-Host "One-file launcher + Apache license, sha256=$hash"

      - name: Verify release-ready GameFrame ZIP and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'ScorchedPlanetFix-v2.0.2-Windows-x64.zip'
          Compress-Archive -Path dist/* -DestinationPath $archive
          Expand-Archive -Path $archive -DestinationPath dist-verify -Force
          $expected = @('ScorchedPlanetFix.exe','LICENSE.txt','LICENSE-APACHE.txt','README.md','RELEASE-NOTES.txt','GAMEFRAME-INFO.txt','SHA256SUMS.txt')
          $actual = @(Get-ChildItem dist-verify -File)
          if ($actual.Count -ne $expected.Count) { throw "Wrong file count in GameFrame ZIP: $($actual.Count)" }
          foreach ($name in $expected) {
            if (!(Test-Path -PathType Leaf (Join-Path dist-verify $name))) { throw "Missing $name in GameFrame ZIP" }
          }
          $manifest = (Get-Content dist-verify/SHA256SUMS.txt -Raw).Trim()
          if ($manifest -cnotmatch '^[0-9a-f]{64}  ScorchedPlanetFix\.exe$') { throw 'Bad SHA256SUMS format' }
          $hash=(Get-FileHash dist-verify/ScorchedPlanetFix.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.Substring(0,64) -cne $hash) { throw 'GameFrame ZIP checksum mismatch' }
          Write-Host "Verified GameFrame stable ZIP: 7 files and SHA256=$hash"

      # Artifacts already use ZIP internally. Upload 7 flat files, not ZIP-in-ZIP.
      - name: Upload verified Windows GameFrame files
        uses: actions/upload-artifact@v6
        with:
          name: ScorchedPlanetFix-v2.0.2-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
